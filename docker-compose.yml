services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: proofgraph
      POSTGRES_USER: proofgraph
      POSTGRES_PASSWORD: proofgraph
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofgraph"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./apps/api
    env_file: .env
    command: sh -c "python manage.py migrate --run-syncdb && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    volumes: ["uploads:/app/media"]
  worker:
    build: ./apps/api
    env_file: .env
    command: celery -A config worker --loglevel=INFO
    depends_on: [api, redis]
    volumes: ["uploads:/app/media"]
  web:
    build: ./apps/web
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  postgres_data:
  uploads:
