services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: proofgraph
      POSTGRES_USER: proofgraph
      POSTGRES_PASSWORD: proofgraph
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofgraph"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  postgres_data:
